name: Build and Release Campus-Bibliothek

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Wheels
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\cache
          key: ${{ runner.os }}-pip-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-cache-

      - name: Cache PyInstaller Dependency Graph
        uses: actions/cache@v4
        with:
          path: |
            build/Buchsortierer
            ~/AppData/Local/pyinstaller
          key: ${{ runner.os }}-pyinstaller-${{ hashFiles('Buchsortierer.spec') }}
          restore-keys: |
            ${{ runner.os }}-pyinstaller-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller Buchsortierer.spec --noconfirm

      - name: Create Instant Delta Patch
        run: |
          cd dist/Buchsortierer
          7z a -tzip -mx=1 "../Campus-Bibliothek-Patch.zip" "Buchsortierer.exe" "_internal/base_library.zip" "_internal/*.pyc" "_internal/ui*" "_internal/ai*" "_internal/core*"
          cd ../..

      - name: Publish Instant Release (Immediate Availability)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Campus-Bibliothek-Patch.zip
          name: Campus-Bibliothek ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Portable Zip Package
        run: |
          7z a -tzip -mx=1 "dist/Campus-Bibliothek-Portable.zip" "./dist/Buchsortierer/*"

      - name: Install Inno Setup Fast & Compile Installer
        run: |
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_3_3/innosetup-6.3.3.exe" -OutFile "innosetup.exe"
          Start-Process -FilePath ".\innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -NoNewWindow -Wait
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Full Installer and Portable to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Campus-Bibliothek-Portable.zip
            installer_output/Campus-Bibliothek-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
