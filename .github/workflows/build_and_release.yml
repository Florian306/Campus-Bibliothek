name: Build and Release Campus-Bibliothek

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller Buchsortierer.spec --noconfirm

      - name: Compile Windows Installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Portable Zip Package and Delta Patch
        run: |
          7z a -tzip -mx=3 "dist/Campus-Bibliothek-Portable.zip" "./dist/Buchsortierer/*"
          7z a -tzip -mx=3 "dist/Campus-Bibliothek-Patch.zip" "./dist/Buchsortierer/Buchsortierer.exe" "./dist/Buchsortierer/_internal/base_library.zip"

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Campus-Bibliothek-Patch.zip
            dist/Campus-Bibliothek-Portable.zip
            installer_output/Campus-Bibliothek-Setup.exe
          name: Campus-Bibliothek ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
